<div class="container">
  <h1>Калькулятор</h1>

  <div class="form-group">
    <label>Система счисления:</label>
    <select [(ngModel)]="selectedBase" class="form-control">
      <option *ngFor="let base of numberBases" [value]="base.value">
        {{ base.label }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label>Первое число:</label>
    <app-number-input
      [value]="firstNumber"
      [base]="selectedBase"
      (valueChange)="onFirstNumberChange($event)">
    </app-number-input>
  </div>

  <div class="form-group">
    <label>Операция:</label>
    <select [(ngModel)]="operation" class="form-control">
      <option *ngFor="let op of operations" [value]="op.value">
        {{ op.label }}
      </option>
    </select>
  </div>

  <div class="form-group">
    <label>Второе число:</label>
    <app-number-input
      [value]="secondNumber"
      [base]="selectedBase"
      [preventZero]="isDivision"
      (valueChange)="onSecondNumberChange($event)">
    </app-number-input>
    <small *ngIf="isDivision" class="text-muted">
      При делении второе число не может быть 0
    </small>
  </div>

  <button (click)="calculate()" [disabled]="!canCalculate">
    Вычислить
  </button>

  <div *ngIf="errorMessage" class="error-message">
    {{ errorMessage }}
  </div>

  <div *ngIf="result" class="result-container">
    <label>Результат:</label>
    <div 
      class="result" 
      [appResultColor]="getResultAsNumber()">
      {{ result | decimalPlaces:2 }}
    </div>
  </div>
</div>
